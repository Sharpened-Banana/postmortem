name: Package and release WoW addon

# Fires on any tag push (e.g. `git tag v0.1.0 && git push --tags`) -- the
# packager uses the tag name as the addon's release version. Only the
# addon/Postmortem/ subtree is ever packaged (see .pkgmeta at the repo
# root); the Python tool living alongside it in this monorepo is untouched.
on:
  push:
    # Only the addon's own tags. The packager derives the CurseForge file
    # type from the tag name: anything containing "alpha"/"beta" is
    # uploaded as an alpha/beta file, which the CurseForge app does not
    # install unless a user opts in -- so addon releases must never ride
    # on the desktop app's alpha-desktop-N tags (39 and 40 went to
    # CurseForge as alpha files nobody receives). Tag `addon-vX.Y.Z` to
    # publish the addon; the desktop app has its own alpha-desktop-N.
    tags:
      - 'addon-v*'

# The auto-provided GITHUB_TOKEN needs write access to create a GitHub
# Release for the packaged zip -- verified against the BigWigs packager's
# own documented GitHub Actions example.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the packager reads git tags for changelog generation

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          # Set these as repository secrets (Settings -> Secrets and
          # variables -> Actions) for whichever site(s) you want to publish
          # to. Any left unset are simply skipped -- see README's "Which
          # files do I need to submit" / this repo's own README for where
          # to get each token. CF_API_KEY: CurseForge, Settings -> API
          # Tokens. WOWI_API_TOKEN: WoWInterface, downloads/filecpl.php ->
          # API Tokens. WAGO_API_TOKEN: Wago Addons, developer dashboard ->
          # API keys.
          #
          # Variable NAMES are what the pinned packager@v2 actually reads
          # (its release.sh: `cf_token=$CF_API_KEY`,
          # `github_token=$GITHUB_OAUTH`). The names in the packager's
          # current README (CF_API_TOKEN / GITHUB_API_TOKEN) belong to a
          # newer, untagged version; with those, every run since the repo
          # was re-created packaged the zip and then uploaded it nowhere,
          # silently -- the run log printed "GitHub: <slug>" without
          # " [token set]". Found 2026-09-11. CurseForge additionally needs
          # `## X-Curse-Project-ID: <id>` in the .toc.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
