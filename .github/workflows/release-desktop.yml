# Builds the Postmortem desktop app for macOS and Windows and
# attaches them to a GitHub Release whenever a tag is pushed.
#
# Three assets per release:
#   Postmortem-macos.zip          -- the .app bundle
#   Postmortem-windows.zip        -- portable onedir folder
#   Postmortem-Setup-windows.exe  -- ordinary Windows installer
#
# Both Windows assets are published on purpose. The installer is the
# normal way to install (Start Menu entry, uninstaller, no UAC prompt --
# see build/postmortem.iss); the zip stays because desktop/updater.py's
# in-app self-update downloads and swaps it in place, which an installer
# can't do while the app it would overwrite is running.
#
# Why a build matrix instead of one job: PyInstaller is NOT a
# cross-compiler -- it can only produce a native build for the OS it
# runs on, so a macOS .app and a Windows .exe genuinely require two
# separate runners. No Linux build target exists for this app yet.
#
# Code signing (docs/CODE_SIGNING.md has the account setup):
#   macOS   -- Developer ID certificate imported from secrets, PyInstaller
#              signs every binary with the hardened runtime
#              (build/postmortem.spec + build/entitlements.plist), then the
#              .app is notarized with notarytool and stapled.
#   Windows -- Azure Trusted Signing signs the app exe (before it is
#              zipped and packed into the installer) and the installer.
# In a fork, every signing step is skipped, with a notice, when its
# secrets are not configured, so the fork still builds -- unsigned, with
# the Gatekeeper / SmartScreen warnings that implies. In the canonical
# repository (Sharpened-Banana/postmortem) a missing signing or
# notarization secret FAILS the job instead: every installed app
# auto-updates to what this workflow publishes, so a lapsed secret would
# otherwise quietly ship an unsigned build to all of them.

name: Release desktop app

on:
  push:
    tags:
      # The desktop app's own tags only; the addon has addon-v* (see
      # release-addon.yml).
      - 'alpha-desktop-*'
      # Beta channel (docs/RELEASE_CHANNELS.md): beta-desktop-N.M builds
      # go out as pre-releases that only apps on the beta channel see.
      - 'beta-desktop-*'

permissions:
  contents: write
  # For build provenance (see the attestation step below): the attestation
  # is signed with a short-lived OIDC identity for this workflow run, which
  # is what makes it a claim about WHO built the file rather than just what
  # the file hashes to.
  id-token: write
  attestations: write

jobs:
  # Before ANYTHING is created: the tag must be exactly alpha-desktop-N or
  # beta-desktop-N.M. The on.push filter above is a glob, and so was the
  # old check (which ran only in the build jobs, after the release already
  # existed): alpha-desktop-50.1 passed both and would have been published
  # as the "Latest" stable release, yet desktop/updater.py's build_key()
  # returns None for it, so an app stamped with it could never update
  # again. A quote in a tag name also reached generated Python source and
  # the installer compiler's command line. The tag is read from the
  # environment, never interpolated into the script, so the check itself
  # can't be injected.
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a plain release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^alpha-desktop-[0-9]+$ ]] \
             || [[ "$GITHUB_REF_NAME" =~ ^beta-desktop-[0-9]+\.[0-9]+$ ]]; then
            echo "releasing $GITHUB_REF_NAME"
          else
            echo "::error::refusing to release from tag '$GITHUB_REF_NAME' -- expected alpha-desktop-N or beta-desktop-N.M"
            exit 1
          fi

  # The suite, before a release exists: a tag pushed from a commit that
  # fails its own tests must not become the build every installed app
  # auto-updates to.
  tests:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest certifi
      - name: Test
        run: python -m pytest tests -q

  # Create the tag's GitHub release exactly once, before any build runs.
  # Both matrix builds (and release-addon.yml's packager) then only ever
  # *upload* to an existing release. Letting each job create-or-update it
  # raced: softprops in the two matrix jobs raced each other (alpha-
  # desktop-39: "Validation Failed: already_exists" after three retries,
  # macOS job failed, Windows job cancelled by fail-fast), and the addon
  # packager raced both (alpha-desktop-37, a 422 of its own).
  release:
    needs: [validate-tag, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Create the release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            # A FULL release, explicitly marked "Latest" -- not --prerelease.
            # GitHub's /releases/latest (what every installed app before
            # alpha-desktop-45 polls, and what the site's download link
            # points at) is the newest non-draft, non-prerelease release.
            # While desktop builds were pre-releases, the addon pipeline's
            # first full release (addon-v0.3.1, 2026-09-13) became "latest"
            # forever and no installed app was offered another update.
            # release-addon.yml un-marks its own releases as latest so a
            # later addon tag can't take it back.
            case "$GITHUB_REF_NAME" in
              beta-desktop-*)
                # A PRE-release: never "Latest", so the stable channel
                # (and apps before alpha-desktop-45, which poll
                # /releases/latest) never see it. Only apps set to the
                # beta channel pick these up.
                gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --title "$GITHUB_REF_NAME (beta)" --prerelease \
                  --notes "Beta desktop build $GITHUB_REF_NAME -- for testers on the beta update channel." ;;
              *)
                gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --title "$GITHUB_REF_NAME" --latest \
                  --notes "Desktop app (macOS + Windows) and WoW addon build $GITHUB_REF_NAME." ;;
            esac
          fi

  build:
    needs: release
    strategy:
      # One platform failing must not cancel the other's upload -- each
      # asset is independently useful, and a partial release is easy to
      # complete by re-running only the failed job.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      # Stamps the tag being released (e.g. "alpha-desktop-8") into
      # _version.py *before* `pip install` below copies the package
      # into site-packages -- that's the copy PyInstaller actually
      # bundles, so this has to happen first. Not committed back to the
      # repo: this only touches the CI runner's own checkout. A source
      # checkout / dev run never touches this file, so it keeps
      # _version.py's checked-in "dev" placeholder, which
      # desktop/updater.py already treats as "not a release build" --
      # see that module's own docstring.
      # A tag is pushed by hand, and it lands in generated Python source
      # and on the installer compiler's command line -- so a tag with a
      # quote in it would inject code into the build. validate-tag has
      # already refused anything else; repeated here, with the same
      # strict patterns, right before the tag is written into source.
      - name: Check the tag is a plain release tag
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^alpha-desktop-[0-9]+$ ]] \
             && ! [[ "$GITHUB_REF_NAME" =~ ^beta-desktop-[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to build from tag '$GITHUB_REF_NAME'"; exit 1
          fi

      - name: Stamp version
        shell: bash
        run: |
          cat > src/postmortem/desktop/_version.py <<EOF
          VERSION = "${GITHUB_REF_NAME}"
          EOF

      - name: Install package + build tooling
        run: pip install ".[dev,desktop]"

      # Windows: pywebview's folder picker reflects on .NET Framework
      # internals at import time and kills the whole window backend
      # under modern .NET -- see build/patch_pywebview.py. Patched in
      # site-packages before PyInstaller freezes it.
      - name: Patch pywebview for modern .NET
        if: runner.os == 'Windows'
        run: python build/patch_pywebview.py

      # macOS: put the Developer ID certificate where codesign can find
      # it. A throwaway keychain, unlocked for the job and deleted after,
      # so the key never lands in the login keychain of a shared runner.
      # The identity NAME is read back from the keychain rather than
      # typed into a secret -- one fewer string to get subtly wrong.
      # Everything downstream keys off POSTMORTEM_CODESIGN_IDENTITY being
      # set: PyInstaller signs (see the spec), the notarize step runs.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            # See "canonical repository" in the header: never ship an
            # unsigned build from the real repo because a secret lapsed.
            if [ "$GITHUB_REPOSITORY" = "Sharpened-Banana/postmortem" ]; then
              echo "::error::MACOS_CERT_P12 is not set -- refusing to publish an unsigned macOS build from $GITHUB_REPOSITORY"
              exit 1
            fi
            echo "::notice::MACOS_CERT_P12 not set -- building an unsigned macOS app"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a UI prompt (there is none).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::no 'Developer ID Application' identity in the imported certificate"
            exit 1
          fi
          echo "signing as: $identity"
          echo "POSTMORTEM_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: pyinstaller build/postmortem.spec

      # macOS: prove the signature before spending minutes on notarization,
      # then notarize the zipped app, staple the ticket INTO the .app (so
      # Gatekeeper passes it offline, and so the copy the in-app updater
      # extracts carries it too), and re-zip -- the zip must be made from
      # the stapled bundle, not before.
      - name: Notarize and staple
        if: runner.os == 'macOS' && env.POSTMORTEM_CODESIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Postmortem.app
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            if [ "$GITHUB_REPOSITORY" = "Sharpened-Banana/postmortem" ]; then
              echo "::error::APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID not all set -- refusing to publish an un-notarized macOS build from $GITHUB_REPOSITORY"
              exit 1
            fi
            echo "::warning::signed but NOT notarized: APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID not all set"
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/Postmortem.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarize.json" || true
          cat "$RUNNER_TEMP/notarize.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$RUNNER_TEMP/notarize.json")"
          if [ "$status" != "Accepted" ]; then
            sub_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/notarize.json")"
            [ -n "$sub_id" ] && xcrun notarytool log "$sub_id" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::notarization status: ${status:-unknown}"
            exit 1
          fi
          xcrun stapler staple dist/Postmortem.app
          spctl --assess --type execute --verbose=2 dist/Postmortem.app

      # macOS: zip the .app bundle with ditto, not plain `zip -r` --
      # ditto is Apple's own recommended way to archive a .app for
      # distribution because it preserves resource forks, extended
      # attributes, and executable permission bits that a generic zip
      # can silently mangle. After notarization: the archive must hold the
      # STAPLED bundle.
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Postmortem.app Postmortem-macos.zip

      # Windows: swap pywebview's bundled WebView2 .NET assemblies for
      # the modern-.NET build of the same library. pywebview ships the
      # .NET Framework (net462) build, whose WebView2 control references
      # System.Windows.Forms.ContextMenu -- a type modern .NET removed --
      # so under CoreCLR (which this app must use; see desktop/app.py)
      # pythonnet dies reflecting it with "Could not load type
      # 'System.Windows.Forms.ContextMenu'" (alpha-desktop-32,
      # 2026-09-08). Microsoft's own NuGet package carried a
      # netcoreapp3.0 build up to 1.0.2592.51 (later versions dropped
      # it, net462 only); every WebView2 API pywebview's edgechromium.py
      # calls predates that version, and an older SDK is compatible with
      # the newer Evergreen WebView2 Runtime on the machine. The native
      # loader DLLs are replaced from the same package so all three
      # match.
      - name: Swap in the modern-.NET WebView2 assemblies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.0.2592.51"
          # Pinned by DIGEST, not only by version. These DLLs are copied
          # straight into the release and nothing signs it, so a registry
          # compromise or an interception on the runner would otherwise put
          # attacker code inside a build users auto-update to. Verified
          # against the real package on 2026-09-11 (8,196,752 bytes).
          # To move to a new version: download it, take its SHA-256, and
          # change BOTH lines deliberately.
          $sha = "805c79e05184fab18c9fe7b8ba820c598399b97adc1fbf5b0ea490efad91d5b8"
          $nupkg = "$env:RUNNER_TEMP\webview2.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $nupkg
          $actual = (Get-FileHash -Path $nupkg -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) {
            throw "WebView2 $ver digest mismatch: expected $sha, got $actual"
          }
          $pkg = "$env:RUNNER_TEMP\webview2"
          Expand-Archive -Path $nupkg -DestinationPath $pkg -Force
          $lib = (Get-ChildItem -Path dist\Postmortem -Recurse -Filter Microsoft.Web.WebView2.WinForms.dll | Select-Object -First 1).DirectoryName
          if (-not $lib) { throw "pywebview's WebView2 DLLs not found in dist\Postmortem" }
          Write-Host "replacing WebView2 assemblies in $lib with $ver (netcoreapp3.0)"
          Copy-Item "$pkg\lib\netcoreapp3.0\Microsoft.Web.WebView2.Core.dll" "$lib\Microsoft.Web.WebView2.Core.dll" -Force
          Copy-Item "$pkg\lib\netcoreapp3.0\Microsoft.Web.WebView2.WinForms.dll" "$lib\Microsoft.Web.WebView2.WinForms.dll" -Force
          foreach ($rid in "win-x64", "win-x86", "win-arm64") {
            $dst = Join-Path $lib "runtimes\$rid\native\WebView2Loader.dll"
            $src = Join-Path $pkg "runtimes\$rid\native\WebView2Loader.dll"
            if ((Test-Path $dst) -and (Test-Path $src)) { Copy-Item $src $dst -Force }
          }
          Get-ChildItem $lib -Filter Microsoft.Web.WebView2.*.dll | ForEach-Object { "{0}  {1}" -f $_.Name, $_.VersionInfo.FileVersion }

      # Windows: sign the application executable BEFORE it is zipped and
      # before Inno Setup packs it, so both the portable copy and the
      # installed one carry the signature. Azure Trusted Signing: the
      # certificate never leaves Azure; the runner authenticates as a
      # service principal and sends digests. Skipped, unsigned, when the
      # secrets are absent (see the job-level comment at the top).
      # Pinned to a commit per this repository's action-pinning rule.
      - name: Decide whether Windows signing is configured
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "WINDOWS_SIGNING=1" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REPOSITORY" = "Sharpened-Banana/postmortem" ]; then
            echo "::error::AZURE_CLIENT_ID is not set -- refusing to publish unsigned Windows assets from $GITHUB_REPOSITORY"
            exit 1
          else
            echo "::notice::AZURE_CLIENT_ID not set -- building unsigned Windows assets"
          fi

      - name: Sign the app executable (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == '1'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Postmortem
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Windows: the spec builds a onedir (COLLECT) layout rather than
      # --onefile, so zip the whole dist/Postmortem/ folder as the
      # single downloadable artifact. Kept alongside the installer below
      # -- a portable copy is genuinely useful (a USB stick, a
      # locked-down machine) and some people would simply rather unzip.
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Postmortem/* -DestinationPath Postmortem-windows.zip

      # ...and the ordinary path: a real installer. Inno Setup is
      # preinstalled on GitHub's windows-latest image (ISCC.exe under
      # %ProgramFiles(x86)%\Inno Setup 6); choco covers the case where a
      # future image drops it, rather than failing the release.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Version-pinned: this compiler builds the installer users
            # actually run, and "latest" makes each release depend on
            # whatever the package feed served that day.
            choco install innosetup --version=6.2.2 --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          & $iscc "/DAppVersion=$env:GITHUB_REF_NAME" build\postmortem.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Move-Item installer\Postmortem-Setup.exe Postmortem-Setup-windows.exe

      # ...and the installer itself, which is what SmartScreen judges on
      # download. (Inno's own uninstaller is not signed: it is generated
      # inside the installer at build time, and signing it needs a local
      # signtool hook that Trusted Signing's action does not provide.
      # Windows does not warn on uninstall, so nothing user-visible.)
      - name: Sign the installer (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == '1'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\Postmortem-Setup-windows.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Show the Windows signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == '1'
        shell: pwsh
        run: |
          foreach ($f in "dist\Postmortem\Postmortem.exe", "Postmortem-Setup-windows.exe") {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} ({2})" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed" }
          }

      # The release already exists (see the `release` job above); just
      # attach this platform's files. --clobber makes a re-run of a
      # failed job replace its own assets instead of erroring. bash on
      # both runners so the glob and quoting behave the same way.
      # A digest per asset, so the in-app updater can tell the archive it
      # downloaded from one an attacker substituted. Without this the whole
      # trust chain was TLS plus "the host is github.com" -- and one of the
      # two allowed hosts serves every GitHub user's release assets, so any
      # attacker-hosted zip on it passed. Code signatures (above) are
      # checked by the OS on first launch, but the app writes an update's
      # files itself, so no quarantine check applies to an update -- this
      # digest is what the updater trusts (2026-09-11). Computed AFTER
      # signing and stapling, so it matches the bytes that ship.
      #
      # Each platform job appends its own line; --clobber on the upload
      # below lets a re-run replace its own entry.
      #
      # Python, not shasum: Git Bash on the Windows runner has no shasum,
      # which failed alpha-desktop-41's Windows job at this step -- the
      # first real release to run it. setup-python is already on both
      # runners, and the output is the same "<hex>  <name>" line
      # updater.py parses. An empty file (no assets matched) fails the job
      # rather than publishing a SHA256SUMS that verifies nothing.
      - name: Record asset digests
        shell: bash
        run: |
          python - "SHA256SUMS-${{ runner.os }}.txt" <<'PY'
          import glob, hashlib, sys
          names = sorted(glob.glob("Postmortem-*.zip") + glob.glob("Postmortem-Setup-*.exe"))
          if not names:
              sys.exit("no release assets found to digest")
          with open(sys.argv[1], "a", encoding="ascii", newline="\n") as out:
              for name in names:
                  digest = hashlib.sha256()
                  with open(name, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          digest.update(chunk)
                  out.write(f"{digest.hexdigest()}  {name}\n")
          PY
          cat "SHA256SUMS-${{ runner.os }}.txt"

      # Provenance, not just a digest. SHA256SUMS says "these bytes are the
      # ones this release published"; an attestation says "these bytes came
      # out of this workflow, at this commit, in this repository", which is
      # the part a stolen release token cannot forge. Verifiable by anyone
      # with:
      #
      #   gh attestation verify Postmortem-macos.zip --repo Sharpened-Banana/postmortem
      #
      # Pinned to a commit, per this repository's own action-pinning rule
      # (a movable tag on an action that touches a release is the same
      # exposure the addon packager had).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            Postmortem-*.zip
            Postmortem-Setup-*.exe

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob  # macOS has no .exe; drop the empty pattern instead of failing
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            Postmortem-*.zip Postmortem-Setup-*.exe "SHA256SUMS-${{ runner.os }}.txt"

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
