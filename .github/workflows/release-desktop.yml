# Builds the Postmortem desktop app for macOS and Windows and
# attaches them to a GitHub Release whenever a tag is pushed.
#
# Three assets per release:
#   Postmortem-macos.zip          -- the .app bundle
#   Postmortem-windows.zip        -- portable onedir folder
#   Postmortem-Setup-windows.exe  -- ordinary Windows installer
#
# Both Windows assets are published on purpose. The installer is the
# normal way to install (Start Menu entry, uninstaller, no UAC prompt --
# see build/postmortem.iss); the zip stays because desktop/updater.py's
# in-app self-update downloads and swaps it in place, which an installer
# can't do while the app it would overwrite is running.
#
# Why a build matrix instead of one job: PyInstaller is NOT a
# cross-compiler -- it can only produce a native build for the OS it
# runs on, so a macOS .app and a Windows .exe genuinely require two
# separate runners. No Linux build target exists for this app yet.
#
# Known, accepted limitation: the macOS build is unsigned and
# un-notarized (no paid Apple Developer account available for this
# project), so first launch will show a Gatekeeper "unidentified
# developer" warning (right-click -> Open works around it). This is a
# deliberate scope cut for this pass, not a bug to fix here.

name: Release desktop app

on:
  push:
    tags:
      # The desktop app's own tags only; the addon has addon-v* (see
      # release-addon.yml).
      - 'alpha-desktop-*'

permissions:
  contents: write

jobs:
  # Create the tag's GitHub release exactly once, before any build runs.
  # Both matrix builds (and release-addon.yml's packager) then only ever
  # *upload* to an existing release. Letting each job create-or-update it
  # raced: softprops in the two matrix jobs raced each other (alpha-
  # desktop-39: "Validation Failed: already_exists" after three retries,
  # macOS job failed, Windows job cancelled by fail-fast), and the addon
  # packager raced both (alpha-desktop-37, a 422 of its own).
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --prerelease \
              --notes "Desktop app (macOS + Windows) and WoW addon build $GITHUB_REF_NAME."
          fi

  build:
    needs: release
    strategy:
      # One platform failing must not cancel the other's upload -- each
      # asset is independently useful, and a partial release is easy to
      # complete by re-running only the failed job.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stamps the tag being released (e.g. "alpha-desktop-8") into
      # _version.py *before* `pip install` below copies the package
      # into site-packages -- that's the copy PyInstaller actually
      # bundles, so this has to happen first. Not committed back to the
      # repo: this only touches the CI runner's own checkout. A source
      # checkout / dev run never touches this file, so it keeps
      # _version.py's checked-in "dev" placeholder, which
      # desktop/updater.py already treats as "not a release build" --
      # see that module's own docstring.
      - name: Stamp version
        shell: bash
        run: |
          cat > src/postmortem/desktop/_version.py <<EOF
          VERSION = "${GITHUB_REF_NAME}"
          EOF

      - name: Install package + build tooling
        run: pip install ".[dev,desktop]"

      # Windows: pywebview's folder picker reflects on .NET Framework
      # internals at import time and kills the whole window backend
      # under modern .NET -- see build/patch_pywebview.py. Patched in
      # site-packages before PyInstaller freezes it.
      - name: Patch pywebview for modern .NET
        if: runner.os == 'Windows'
        run: python build/patch_pywebview.py

      - name: Build with PyInstaller
        run: pyinstaller build/postmortem.spec

      # macOS: zip the .app bundle with ditto, not plain `zip -r` --
      # ditto is Apple's own recommended way to archive a .app for
      # distribution because it preserves resource forks, extended
      # attributes, and executable permission bits that a generic zip
      # can silently mangle.
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Postmortem.app Postmortem-macos.zip

      # Windows: swap pywebview's bundled WebView2 .NET assemblies for
      # the modern-.NET build of the same library. pywebview ships the
      # .NET Framework (net462) build, whose WebView2 control references
      # System.Windows.Forms.ContextMenu -- a type modern .NET removed --
      # so under CoreCLR (which this app must use; see desktop/app.py)
      # pythonnet dies reflecting it with "Could not load type
      # 'System.Windows.Forms.ContextMenu'" (alpha-desktop-32,
      # 2026-09-08). Microsoft's own NuGet package carried a
      # netcoreapp3.0 build up to 1.0.2592.51 (later versions dropped
      # it, net462 only); every WebView2 API pywebview's edgechromium.py
      # calls predates that version, and an older SDK is compatible with
      # the newer Evergreen WebView2 Runtime on the machine. The native
      # loader DLLs are replaced from the same package so all three
      # match.
      - name: Swap in the modern-.NET WebView2 assemblies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.0.2592.51"
          $nupkg = "$env:RUNNER_TEMP\webview2.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $nupkg
          $pkg = "$env:RUNNER_TEMP\webview2"
          Expand-Archive -Path $nupkg -DestinationPath $pkg -Force
          $lib = (Get-ChildItem -Path dist\Postmortem -Recurse -Filter Microsoft.Web.WebView2.WinForms.dll | Select-Object -First 1).DirectoryName
          if (-not $lib) { throw "pywebview's WebView2 DLLs not found in dist\Postmortem" }
          Write-Host "replacing WebView2 assemblies in $lib with $ver (netcoreapp3.0)"
          Copy-Item "$pkg\lib\netcoreapp3.0\Microsoft.Web.WebView2.Core.dll" "$lib\Microsoft.Web.WebView2.Core.dll" -Force
          Copy-Item "$pkg\lib\netcoreapp3.0\Microsoft.Web.WebView2.WinForms.dll" "$lib\Microsoft.Web.WebView2.WinForms.dll" -Force
          foreach ($rid in "win-x64", "win-x86", "win-arm64") {
            $dst = Join-Path $lib "runtimes\$rid\native\WebView2Loader.dll"
            $src = Join-Path $pkg "runtimes\$rid\native\WebView2Loader.dll"
            if ((Test-Path $dst) -and (Test-Path $src)) { Copy-Item $src $dst -Force }
          }
          Get-ChildItem $lib -Filter Microsoft.Web.WebView2.*.dll | ForEach-Object { "{0}  {1}" -f $_.Name, $_.VersionInfo.FileVersion }

      # Windows: the spec builds a onedir (COLLECT) layout rather than
      # --onefile, so zip the whole dist/Postmortem/ folder as the
      # single downloadable artifact. Kept alongside the installer below
      # -- a portable copy is genuinely useful (a USB stick, a
      # locked-down machine) and some people would simply rather unzip.
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Postmortem/* -DestinationPath Postmortem-windows.zip

      # ...and the ordinary path: a real installer. Inno Setup is
      # preinstalled on GitHub's windows-latest image (ISCC.exe under
      # %ProgramFiles(x86)%\Inno Setup 6); choco covers the case where a
      # future image drops it, rather than failing the release.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          & $iscc "/DAppVersion=$env:GITHUB_REF_NAME" build\postmortem.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Move-Item installer\Postmortem-Setup.exe Postmortem-Setup-windows.exe

      # The release already exists (see the `release` job above); just
      # attach this platform's files. --clobber makes a re-run of a
      # failed job replace its own assets instead of erroring. bash on
      # both runners so the glob and quoting behave the same way.
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob  # macOS has no .exe; drop the empty pattern instead of failing
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            Postmortem-*.zip Postmortem-Setup-*.exe
