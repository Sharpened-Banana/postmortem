# Fly.io app configuration for the public Mythic Analyzer run-tracker
# site (site/mythic_site). Hand-authored -- NOT generated by `fly launch`
# (that would require touching the real Fly.io account, which is outside
# this WP's scope). Review every value below before deploying; see
# site/README.md for the full deploy runbook.

# Fly app names are globally unique across ALL Fly.io accounts, not just
# yours -- "mythic-analyzer" is very likely already taken. Change this to
# whatever's actually available for your account before running
# `fly launch` / `fly deploy` (flyctl will also complain loudly if it
# isn't free).
app = "mythic-analyzer"

# Placeholder -- pick whatever region your account/other Fly apps already
# use (`fly platform regions` lists all of them). "iad" (Ashburn,
# Virginia, US) is a common Fly default, not a requirement.
primary_region = "iad"

# No [build] section needed: Fly auto-detects and uses the Dockerfile at
# the app root (this repo's root, alongside this fly.toml) when one is
# present and no [build] section overrides it. Build context is the repo
# root -- see the Dockerfile's own top comment for why (it needs both
# src/ and site/).

[http_service]
  internal_port = 8080
  force_https = true
  # Both auto_stop_machines/auto_start_machines and min_machines_running
  # are current (2024+) fly.toml syntax as of this writing, but flyctl's
  # schema has shifted before (auto_stop_machines used to be a plain
  # bool; newer flyctl also accepts the string forms "stop"/"suspend"/
  # "off"). Confirm against your installed flyctl version -- running
  # `fly launch --no-deploy` against this repo (see site/README.md) will
  # have flyctl itself flag anything it considers stale.
  auto_stop_machines = true
  auto_start_machines = true
  # Scales to zero when idle (fine for a low-traffic v1); the machine
  # spins back up on the next request. First request after idle will be
  # slightly slower (cold start).
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

# This service is a single SQLite file on one volume -- it must never run
# more than one machine at a time (a second machine can't safely share
# the same SQLite file the way this is built). Don't raise this past 1
# without moving off SQLite first. See site/README.md's deploy runbook
# step on `fly scale count 1` for why this needs enforcing explicitly
# even with min_machines_running = 0 above.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Matches MYTHIC_SITE_DB's default path structure (/data/runs.db) --
# see [env] below. Create this volume once via
# `fly volumes create mythic_data --size 1 --region <primary_region>`
# before the first deploy (site/README.md's runbook, step 2).
[mounts]
  source = "mythic_data"
  destination = "/data"

[env]
  MYTHIC_SITE_DB = "/data/runs.db"
  # The site's date formatting is server-local; pinning UTC avoids a
  # surprising timezone-dependent display for anyone browsing /runs.
  TZ = "UTC"
