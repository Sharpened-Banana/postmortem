[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postmortem"
version = "0.1.0"
description = "Mythic+ route post-mortem companion: import MDT routes, parse WoWCombatLog.txt, and compare plan vs. reality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sharpened Banana" }]
keywords = ["wow", "mythic-plus", "mdt", "combat-log", "warcraft"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
postmortem = "postmortem.cli:main"
# Registered unconditionally (setuptools has no "only with this extra"
# concept for entry points) -- calling it without `pip install
# ".[desktop]"` first fails with a clear ImportError on `webview`,
# same as any other optional-dependency console script.
postmortem-desktop = "postmortem.desktop.app:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.0"]
site = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
desktop = ["pywebview>=6.0", "certifi"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the MDT dungeon/enemy extract inside the package (see
# postmortem/bundled.py) -- both the public site and the desktop app fall
# back to it, so it has to travel with `pip install .`.
[tool.setuptools.package-data]
postmortem = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "site/tests"]
